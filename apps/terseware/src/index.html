<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terseware</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta content="dark light" name="color-scheme" />
    <meta content="#5fb28b" name="theme-color" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        syncTerseUiTheme();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
          syncTerseUiTheme(e.matches);
        });

        function syncTerseUiTheme(prefersDark) {
          prefersDark ??= window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
          const storage = localStorage.getItem('theme');
          const localTheme = storage === 'light' || storage === 'dark' ? storage : null;
          const resolvedTheme = localTheme ? localTheme : prefersDark ? 'dark' : 'light';
          const html = document.documentElement;
          html.classList.remove('light', 'dark');
          html.classList.add(resolvedTheme);
          html.style.colorScheme = resolvedTheme;
        }

        globalThis.syncTerseUiTheme = syncTerseUiTheme;
      })();
    </script>
  </head>
  <body>
    <tw-root></tw-root>
  </body>
</html>
